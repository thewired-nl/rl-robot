[platformio]
src_dir = src
default_envs = serial

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = lolin_s3_mini
board_build.partitions = no_ota.csv
board_build.filesystem = spiffs
build_unflags =
  '-std=gnu++11'
	; '-D ARDUINO_USB_MODE=1'
	; '-D ARDUINO_USB_CDC_ON_BOOT'
build_flags =
  '-std=c++2a'
  '-Isrc/lib'
  '-Isrc/main'

  # vendor/esp-dl
  '-Isrc/vendor/esp-dl/dl'
  '-Isrc/vendor/esp-dl/dl/tool/include'
  '-Isrc/vendor/esp-dl/dl/tensor/include'
  '-Isrc/vendor/esp-dl/dl/base'
  '-Isrc/vendor/esp-dl/dl/base/isa'
  '-Isrc/vendor/esp-dl/dl/math/include'
  '-Isrc/vendor/esp-dl/dl/model/include'
  '-Isrc/vendor/esp-dl/dl/module/include'
  '-Isrc/vendor/esp-dl/fbs_loader/include'
  ## esp-dl esp32-s3 specific
  '-Isrc/vendor/esp-dl/dl/base/isa/xtensa'
  '-Isrc/vendor/esp-dl/dl/base/isa/tie728'
  ## esp-dl esp32-s3 fbs_model pre-compiled file
  '-Lsrc/vendor/esp-dl/fbs_loader/lib/esp32s3'
  '-lfbs_model'

	; '-D ARDUINO_USB_MODE=0'
	'-D ARDUINO_USB_CDC_ON_BOOT=1'
  '-D CORE_DEBUG_LEVEL=5'
  '-D USE_ESP_IDF_LOG'
upload_speed = 1500000
monitor_speed = 1500000
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
targets = compiledb, build
lib_deps =
  ; adafruit/Adafruit BNO055@^1.6.4
  alfredosystems/AlfredoCRSF@^2.4
  tdk-invn-oss/ICM45686@^1.1.9
  https://github.com/cnmat/OSC#3.5.8 ; last non-slopped release
  https://github.com/br3ttb/Arduino-PID-Library

[env:serial]
targets = compiledb, upload
upload_protocol = esptool
